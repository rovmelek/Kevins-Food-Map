<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASC Food</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="left">
      <header class="top">
        <h1>NASC Food</h1>
        <button id="manageBtn" class="btn" aria-haspopup="dialog">Manage</button>
      </header>

      <div class="controls">
        <input id="search" type="search" placeholder="Search by name" aria-label="Search by name">
        <select id="cuisineFilter" aria-label="Filter by food type"><option value="">All food types</option></select>
      </div>
      <p id="origin" class="origin"></p>
      <p id="listStatus" class="visually-hidden" role="status"></p>
      <ul id="list" class="list" aria-label="Restaurants"></ul>
      <p id="ratingNote" class="rating-note" hidden>Ratings from Google Maps. Google doesn't verify reviews but removes fake ones it finds. <a href="https://support.google.com/contributionpolicy/answer/7422880" target="_blank" rel="noopener">About reviews</a></p>
    </aside>

    <main class="right">
      <div id="map"></div>
      <div id="mapNotice" class="map-notice" hidden></div>
    </main>
  </div>
  <dialog id="manageDialog" class="add-dialog" aria-labelledby="manageTitle">
   <div class="dialog-body">
    <header class="dialog-head">
      <h2 id="manageTitle">Manage restaurants</h2>
      <div class="head-actions">
        <button type="button" id="logoutBtn" class="link-btn" hidden>Log out</button>
        <button type="button" id="manageClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
    </header>

    <form id="loginView" class="login" hidden>
      <p id="loginHint" class="hint">Enter the admin password to add, edit or archive restaurants.</p>
      <input id="password" type="password" autocomplete="current-password" aria-label="Admin password" placeholder="Admin password">
      <button class="btn primary" type="submit" id="loginSubmit">Log in</button>
      <p id="loginError" class="form-error" role="alert"></p>
    </form>

    <div id="manageView" hidden>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" id="tabAdd" data-view="add" aria-selected="true" aria-controls="addPane">Add</button>
        <button type="button" role="tab" class="tab" id="tabRestaurants" data-view="restaurants" aria-selected="false" aria-controls="editPane" tabindex="-1">Restaurants</button>
      </div>

      <section id="addPane" role="tabpanel" aria-labelledby="tabAdd">
        <div class="subtabs">
          <label><input type="radio" name="addMode" value="single" checked> One link</label>
          <label><input type="radio" name="addMode" value="bulk"> Bulk paste</label>
        </div>
        <form id="addForm">
          <input id="singleInput" type="url" placeholder="https://maps.app.goo.gl/..." autocomplete="off" aria-label="Google Maps link">
          <textarea id="bulkInput" rows="8" hidden aria-label="Google Maps links" placeholder="Paste Markdown or plain text with one or more Google Maps links, e.g.&#10;- [Szechuan Brothers](https://maps.app.goo.gl/v5wA1hGRb3JP2tYb8)&#10;- https://maps.app.goo.gl/..."></textarea>
          <button class="btn primary" type="submit" id="addSubmit">Add</button>
        </form>
        <ul id="addResults" class="results" aria-live="polite"></ul>
      </section>

      <section id="editPane" role="tabpanel" aria-labelledby="tabRestaurants" hidden>
        <div class="subtabs">
          <label><input type="radio" name="editShow" value="listed" checked> Listed <span id="listedCount"></span></label>
          <label><input type="radio" name="editShow" value="archived"> Archived <span id="archivedCount"></span></label>
        </div>
        <input id="editSearch" type="search" placeholder="Search by name" aria-label="Search restaurants to manage">
        <div class="list-tools">
          <button type="button" class="link-btn" data-tool="all">Select all</button>
          <button type="button" class="link-btn" data-tool="none">Select none</button>
          <span class="spacer"></span>
          <button type="button" class="btn small" data-tool="refresh" title="Look up phone, address and rating again">Update from Google</button>
          <button type="button" class="btn small" data-tool="archive">Archive</button>
          <button type="button" class="btn small" data-tool="restore" hidden>Restore</button>
          <button type="button" class="btn danger small" data-tool="purge" hidden>Delete forever</button>
        </div>
        <p id="editStatus" class="status-line" role="status"></p>
        <ul id="editList" class="edit-list"></ul>
      </section>

      <footer class="dialog-foot">
        <button type="button" id="manageDone" class="btn">Done</button>
      </footer>
    </div>
   </div>
  </dialog>
  <datalist id="cuisineOptions"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js" nonce="__CSP_NONCE__"></script>
</body>
</html>
